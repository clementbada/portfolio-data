name: Sonde API (phase 2)

on:
  workflow_dispatch:
    inputs:
      round:
        description: "Jeu de tests (vide = premier passage, round2 = second)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Appeler les API candidates
        run: python probe/probe.py ${{ inputs.round }} > /tmp/probe_results.json
      - name: Publier les résultats sur la branche probe-results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-results
          git rm -rq --cached .
          cp /tmp/probe_results.json probe_results.json
          git add -f probe_results.json
          git commit -qm "Résultats de la sonde $(date -u +%FT%TZ)"
          git push -f origin probe-results
