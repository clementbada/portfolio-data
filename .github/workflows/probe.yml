name: Sonde API (phase 2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Appeler les API candidates
        run: python probe/probe.py > probe_results.json
      - uses: actions/upload-artifact@v4
        with:
          name: probe-results
          path: probe_results.json
