name: Tests des sources

on:
  push:
    branches: [main]
    paths: ["portfolio_data/**", "tests/**", ".github/workflows/tests.yml"]
  schedule:
    # Chaque lundi 06:30 UTC : vérifie que les API n'ont pas changé de format.
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Logique de repli (hors ligne)
        run: python -m unittest tests.test_fallback -v
      - name: Sources réelles
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
        run: python -m unittest tests.test_sources -v
